<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadify browser SDK live sample</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 820px; margin: 48px auto; padding: 0 20px; color: #17212b; }
  nav { display: flex; gap: 16px; margin: 20px 0 32px; }
  button { padding: 10px 14px; margin-right: 10px; cursor: pointer; }
  pre { min-height: 120px; padding: 16px; background: #f4f6f8; white-space: pre-wrap; border-radius: 8px; overflow-wrap: anywhere; }
  code { font-size: 0.9em; }
</style>
<h1>Threadify browser SDK live sample</h1>
<p>Move between these pages. Each one resumes the same contracted thread with a fresh, scoped browser grant.</p>
<nav>
  <a href="/">Home</a>
  <a href="/checkout">Checkout</a>
  <a href="/review">Review</a>
  <a href="/summary">Summary</a>
</nav>
<h2 id="page-title"></h2>
<p>Thread ID: <code id="thread-id">Connecting…</code></p>
<p>Contract: <code id="contract-name"></code></p>
<section id="step-component" hidden>
  <button id="record" data-threadify-context-source="browser-live-sample"></button>
  <button id="server-mapped" data-threadify-action="checkout_confirmed" data-threadify-context-source="browser-live-sample" hidden>Captured checkout action</button>
  <button id="ignore">Component action outside its include list</button>
</section>
<section id="evidence-component" hidden>
  <button id="evidence" data-threadify-action="review_delivery_options" data-threadify-context-area="home">Review delivery options</button>
  <button id="ignore-evidence">Excluded component action</button>
</section>
<button id="deny">Try forbidden thread</button>
<h3>Contract decisions</h3>
<pre id="decisions" aria-live="polite">Loading…</pre>
<h3>Activity</h3>
<pre id="log" aria-live="polite"></pre>
<script>
  window.addEventListener('error', event => {
    document.querySelector('#log').textContent += `Page error: ${event.message}\n`;
  });
  window.addEventListener('unhandledrejection', event => {
    document.querySelector('#log').textContent += `Page rejection: ${event.reason}\n`;
  });
</script>
<script type="module">
  import { ThreadifyBrowser } from '/sdk.js';
  const engineUrl = __ENGINE_URL__;
  const threadKey = __THREAD_KEY__;
  const contractName = __CONTRACT_NAME__;
  const sessionMarker = __SESSION_MARKER__;
  const knownThreadId = __KNOWN_THREAD_ID__;
  const page = location.pathname;
  const action = page === '/checkout' ? 'browser_checkout' : page === '/review' ? 'browser_complete' : null;
  const titles = { '/': 'Home', '/checkout': 'Checkout', '/review': 'Review', '/summary': 'Summary' };
  const log = document.querySelector('#log');
  const record = document.querySelector('#record');
  const write = line => { log.textContent += line + '\n'; };
  document.querySelector('#page-title').textContent = titles[page];
  document.querySelector('#contract-name').textContent = contractName;
  if (action) {
    document.querySelector('#step-component').hidden = false;
    record.textContent = action === 'browser_checkout' ? 'Record checkout' : 'Complete checkout';
    if (action === 'browser_checkout') document.querySelector('#server-mapped').hidden = false;
  } else if (page === '/') {
    document.querySelector('#evidence-component').hidden = false;
  }

  const connection = await ThreadifyBrowser.connect({
    engineUrl,
    serviceName: 'browser_sample',
    getAccessToken: async () => {
      const response = await fetch('/api/browser-token', {
        method: 'POST', credentials: 'same-origin', headers: { 'X-Threadify-Demo': '1' }
      });
      if (!response.ok) throw new Error(`Grant request failed: HTTP ${response.status} ${await response.text()}`);
      return response.json();
    }
  });
  let thread;
  let threadId = knownThreadId;
  try {
    thread = await connection.thread(threadKey, {
      contract: contractName, role: 'browser_sample',
      refs: { browser_demo_session: sessionMarker }
    });
    threadId = thread.threadId;
    write(`Resumed thread ${threadId} on ${titles[page]}`);
  } catch (error) {
    if (!knownThreadId || !/completed thread/.test(error.message)) throw error;
    write(`Viewing completed thread ${threadId} on ${titles[page]}`);
  }
  document.querySelector('#thread-id').textContent = threadId;
  document.body.dataset.threadId = threadId;

  async function showDecisions() {
    const response = await fetch('/api/decisions', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Threadify-Demo': '1' },
      body: JSON.stringify({ threadId })
    });
    if (!response.ok) throw new Error(`Decisions failed: HTTP ${response.status} ${await response.text()}`);
    const decisions = await response.json();
    document.querySelector('#decisions').textContent = JSON.stringify(decisions, null, 2);
    if (action) {
      record.disabled = !thread || !decisions[action === 'browser_checkout' ? 'canCheckout' : 'canComplete'].allowed;
      if (action === 'browser_checkout') document.querySelector('#server-mapped').disabled = record.disabled;
    }
    return decisions;
  }
  await showDecisions();
  write('can / should / next loaded');
  if (thread) {
    const capture = ThreadifyBrowser.autoCapture({
      thread,
      onError: error => write(`Capture failed: ${error.message}`),
      onRecorded: async ({ name, step, result }) => {
        write(step ? `Mapped click recorded ${step}: ${result?.stepId || 'acknowledged'}` : `Captured ${name}: ${result?.classification || 'acknowledged'}`);
        if (step || result?.classification === 'mapped_step') await showDecisions();
      }
    });
    if (action) capture.scope(document.querySelector('#step-component'), { include: ['#record', '#server-mapped'], steps: { '#record': action } });
    if (page === '/') capture.scope(document.querySelector('#evidence-component'), { include: ['#evidence'] });
  }
  document.querySelector('#deny').onclick = async () => {
    try {
      await connection.thread('browser-live:forbidden');
      write('ERROR: forbidden thread was opened');
    } catch (error) { write(`Forbidden thread denied: ${error.message}`); }
  };
</script>
</html>
